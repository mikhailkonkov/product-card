<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <title>Product card</title>
</head>

<body>
  <div class="all-elements background-picture">
    <h1 class="top-title">Выбери свой продукт</h1>

    <div class="buttons">
      <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
      <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
      <button id="open-google-button">Открыть Google</button>
      <button class="change-color-button">Изменить цвет кнопки</button>
    </div>

    <div class="product-card-wrapper">

      <template id="product-card-template">
        <div class="product-card">
          <img src="" alt="" width="290px" height="245px" class="product-card__img">
          <p class="product-card__for-skin"></p>
          <h3 class="product-card__title"></h3>
          <p class="product-card__descr"></p>
          <span class="product-card__text">Состав:</span>
          <ul class="product-card__composition"></ul>
          <div class="product-card__price-wrapper">
            <span class="product-card__price-text">Цена</span>
            <span class="product-card__price"></span>
          </div>
        </div>
      </template>

    </div>
  </div>

  <footer class="footer">
    <div class="footer-container">
      <address class="footer-brands">
        <h2>Product Cards</h2>
        <p>У нас лучшие продукты для кожи!</p>
        <div class="social-icons">
          <a href="https://t.me/#" target="_blank" class="social-link">
            <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram" width="24" height="24">
          </a>
          <a href="https://vk.com/#" target="_blank" class="social-link">
            <img src="https://cdn.simpleicons.org/vk/ffffff" alt="VK" width="24" height="24">
          </a>
        </div>
      </address>

      <section class="footer-subscribe">
        <h3>Подпишись на наши акции:</h3>

        <div class="subscribe-block">
          <form id="subscribe-form">
            <input type="email" placeholder="Введите email">
            <button type="submit">Подписаться</button>
          </form>
          <button type="button" id="open-modal-btn">Регистрация</button>
        </div>
      </section>

      <nav class="footer-links">
        <h3>Быстрые ссылки</h3>
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">Магазин</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>
    </div>

    <div class="footer-bottom">
      <hr>
      <p>www.product-cards.com©all right reserve</p>
    </div>
  </footer>

  <div class="modal">
    <div class="modal-content">
      <button class="close-modal-btn">&times;</button>
      <h2>Регистрация</h2>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-firstname">Имя:</label>
          <input type="text" id="reg-firstname" required placeholder="Иван">
        </div>

        <div class="form-group">
          <label for="reg-lastname">Фамилия:</label>
          <input type="text" id="reg-lastname" required placeholder="Иванов">
        </div>

        <div class="form-group">
          <label for="reg-birthdate">Дата рождения:</label>
          <input type="date" id="reg-birthdate">
        </div>

        <div class="form-password">
          <label for="reg-password">Пароль</label>
          <input type="password" id="reg-password" required placeholder="Придумайте пароль">
        </div>

        <div class="form-password">
          <label for="reg-password-confirm">Пароль</label>
          <input type="password" id="reg-password-confirm" required placeholder="Повторите пароль">
        </div>
        <button type="submit" class="submit-btn">Создать аккаунт</button>
      </form>

    </div>
  </div>
  <script type="module" src="./homework-8.js"></script>
  <script type="module" src="./homework-9.js"></script>
</body>

</html>
