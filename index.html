<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <title>Product card</title>
</head>

<body>
  <div class="all-elements background-picture">
    <h1 class="top-title">Выбери свой продукт</h1>

    <div class="buttons">
      <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
      <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
      <button id="open-google-button">Открыть Google</button>
      <button class="change-color-button">Изменить цвет кнопки</button>
    </div>

    <div class="product-card-wrapper">

      <template id="product-card-template">
        <div class="product-card">
          <img src="" alt="" width="290px" height="245px"
            class="product-card__img">
          <p class="product-card__for-skin"></p>
          <h3 class="product-card__title"></h3>
          <p class="product-card__descr"></p>
          <span class="product-card__text">Состав:</span>
          <ul class="product-card__composition"></ul>
          <div class="product-card__price-wrapper">
            <span class="product-card__price-text">Цена</span>
            <span class="product-card__price"></span>
          </div>
        </div>
      </template>

    </div>
  </div>
  <script type="module" src="./homework-8.js"></script>
</body>

</html>
